<form hx-post="{% url 'approvals:add_comment' workspace_id=workspace.id post_id=post.id %}"
      hx-target="#comment-list-{{ post.id }}"
      hx-swap="outerHTML"
      hx-encoding="multipart/form-data"
      class="space-y-2"
      x-data="{ visibility: 'external' }">

    <textarea name="body" rows="2" required
              class="w-full px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-300 focus:border-transparent resize-none"
              placeholder="Escribe un comentario... Usa @nombre para mencionar a alguien"></textarea>

    <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
            <!-- Visibility toggle -->
            <div class="flex items-center gap-1.5">
                <button type="button" @click="visibility = 'external'"
                        :class="visibility === 'external' ? 'bg-stone-900 text-app-inverse' : 'bg-app-2 text-app-tertiary hover:bg-app-3'"
                        class="px-2.5 py-1 text-[0.6875rem] font-semibold rounded-full transition-colors">
                    Visible para el cliente
                </button>
                <button type="button" @click="visibility = 'internal'"
                        :class="visibility === 'internal' ? 'bg-amber-500 text-app-inverse' : 'bg-app-2 text-app-tertiary hover:bg-app-3'"
                        class="px-2.5 py-1 text-[0.6875rem] font-semibold rounded-full transition-colors">
                    Solo interno
                </button>
            </div>
            <input type="hidden" name="visibility" :value="visibility">

            <!-- Attachment -->
            <label class="cursor-pointer text-app-ghost hover:text-app-secondary transition-colors">
                {% icon "paperclip" css_class="w-4 h-4" %}
                <input type="file" name="attachment" accept="image/*" class="hidden">
            </label>
        </div>

        <button type="submit"
                class="px-3.5 py-1.5 text-[0.8125rem] font-semibold rounded-full text-app-inverse transition-colors"
                style="background: var(--primary);">
            Comentar
        </button>
    </div>
</form>
