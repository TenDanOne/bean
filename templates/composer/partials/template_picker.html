<!-- Template picker modal content (loaded via HTMX) -->
<div class="space-y-3">
    {% for tpl in templates %}
    <a href="{% url 'composer:use_template' workspace_id=workspace.id template_id=tpl.id %}"
       class="block p-3 rounded-lg border border-app hover:border-app-hover hover:bg-app-1 transition-colors">
        <div class="flex items-center justify-between mb-1">
            <span class="text-sm font-semibold text-app-strong">{{ tpl.name }}</span>
        </div>
        {% if tpl.description %}
        <p class="text-xs text-app-tertiary line-clamp-1">{{ tpl.description }}</p>
        {% endif %}
        {% if tpl.template_data.caption %}
        <p class="text-xs text-app-ghost mt-1 line-clamp-1 font-mono">{{ tpl.template_data.caption|truncatechars:80 }}</p>
        {% endif %}
    </a>
    {% empty %}
    <div class="text-center py-8">
        <p class="text-sm text-app-tertiary">No templates yet.</p>
        <p class="text-xs text-app-ghost mt-1">Save a post as a template to see it here.</p>
    </div>
    {% endfor %}
</div>
