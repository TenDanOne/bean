<div class="flex gap-4 scroll-x pb-4" style="min-height: 400px;">
    {% for col in columns %}
        {% include "composer/partials/kanban_column.html" with col=col %}
    {% endfor %}

    <!-- Add new column -->
    <div class="flex-shrink-0 w-[260px]" data-new-group-tile x-data="{ adding: false, newName: '' }">
        <button x-show="!adding" @click="adding = true; $nextTick(() => $refs.groupInput.focus())"
                class="flex items-center gap-2 px-3 py-2.5 text-[13px] font-semibold text-app-ghost hover:text-app-secondary transition-colors rounded-xl hover:bg-app-2 w-full">
            {% icon "plus" css_class="w-4 h-4" %}
           Nuevo grupo
        </button>
        <div x-show="adding" x-cloak class="bg-app-2 rounded-xl p-3">
            <form @submit.prevent="createGroup(newName); adding = false; newName = ''">
                <input x-ref="groupInput" x-model="newName" type="text" placeholder="Nombre de la columna..."
                       @keydown.escape="adding = false; newName = ''"
                       class="w-full px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-200 focus:border-orange-400">
                <div class="flex items-center gap-2 mt-2">
                    <button type="submit" class="px-3 py-1 text-xs font-semibold text-app-inverse bg-orange-500 rounded-lg hover:bg-orange-600 transition-colors">Agregar</button>
                    <button type="button" @click="adding = false; newName = ''" class="px-3 py-1 text-xs font-medium text-app-tertiary hover:text-app-body transition-colors">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
</div>
