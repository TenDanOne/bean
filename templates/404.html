<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No encontrado - BEAN</title>
    {% include "errors/_style.html" %}
</head>
<body>
    <main class="card">
        <div class="logo"><img src="/static/marca/bean-by-ithos.svg" alt="BEAN by ITHOS"></div>
        <div class="big" aria-hidden="true">404</div>
        <h1>No encontramos esta página</h1>
        <p class="message">El enlace puede estar desactualizado o pertenecer a otro espacio de trabajo.</p>
        {% if request_path %}
        <div class="reason"><strong>Ruta solicitada</strong>{{ request_path }}</div>
        {% endif %}
        <div class="acts">
            <a class="btn primary" href="/">Volver al inicio</a>
            <a class="btn" href="{% if request.workspace %}{% url 'calendar:calendar' request.workspace.id %}{% else %}/{% endif %}">Ir a Publicar</a>
        </div>
    </main>
</body>
</html>
