<!-- Invitar miembro Modal -->
<template x-teleport="body">
    <div x-show="showInviteModal" x-transition.opacity
         class="fixed inset-0 z-50 flex items-center justify-center"
         style="background: rgba(0,0,0,0.4);">
        <div @click.outside="showInviteModal = false"
             x-show="showInviteModal"
             x-transition
             class="w-full max-w-lg rounded-xl shadow-xl flex flex-col max-h-[90vh]"
             style="background: var(--surface-0);">

            <!-- Header -->
            <div class="flex items-center justify-between px-6 py-4 flex-shrink-0" style="border-bottom: 1px solid var(--border);">
                <h3 class="text-base font-semibold" style="color: var(--text-primary);">Invitar miembro</h3>
                <button @click="showInviteModal = false" class="cursor-pointer" style="color: var(--text-tertiary);">
                    {% icon "xmark" css_class="w-[20px] h-[20px]" %}
                </button>
            </div>

            <!-- Form -->
            <form hx-post="{% url 'members:invite' %}"
                  hx-target="#invitations-list"
                  hx-swap="beforeend"
                  data-inline-error="#invite-error"
                  @htmx:after-request.window="if(event.detail.successful) { showInviteModal = false; document.getElementById('no-invites-placeholder')?.remove(); document.getElementById('invite-error').textContent = ''; }"
                  {% comment %}
                  Local to the form, only so the role's description can follow
                  the picker. Nothing is submitted from Alpine.
                  {% endcomment %}
                  x-data="{ role: 'editor' }"
                  class="px-6 py-5 overflow-y-auto">
                {% csrf_token %}

                <!-- Email -->
                <div class="mb-5">
                    <label for="invite-email" class="block text-sm font-medium mb-1.5" style="color: var(--text-primary);">Correo electrónico</label>
                    <input type="email" id="invite-email" name="email" required placeholder="colega@ejemplo.com"
                           class="input-focus w-full px-4 py-2.5 text-sm outline-none transition-all"
                           style="border: 1px solid var(--border); color: var(--text-primary); background: var(--surface-1);">
                </div>

                {% comment %}
                One role, chosen once. It used to be a picker beside every brand,
                plus a separate Organization Role radio group above — two ladders
                on one form that read as one. The org role is gone from here
                entirely: everyone invited joins as a member of the account, and
                what they can *do* is this single choice.
                {% endcomment %}
                <div class="mb-5">
                    <label for="invite-role" class="block text-sm font-medium mb-1.5" style="color: var(--text-primary);">Rol</label>
                    <select id="invite-role" name="workspace_role"
                            class="input-focus w-full px-4 py-2.5 text-sm outline-none transition-all cursor-pointer"
                            style="border: 1px solid var(--border); color: var(--text-primary); background: var(--surface-1);"
                            x-model="role">
                        {% for value, label in workspace_role_choices %}
                        <option value="{{ value }}" {% if value == "editor" %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                    <p class="text-xs mt-1.5 leading-snug" style="color: var(--text-tertiary);">
                        {% for value, label, description in workspace_role_descriptions %}
                        <span x-show="role === '{{ value }}'" x-cloak>{{ description }}</span>
                        {% endfor %}
                    </p>
                </div>

                <!-- Brands -->
                <div class="mb-5">
                    <label class="block text-sm font-medium mb-1.5" style="color: var(--text-primary);">Marcas en las que trabaja</label>
                    <p class="text-xs mb-3" style="color: var(--text-tertiary);">
                        Al entrar no verá ningún canal. Otorga los accesos por marca una vez que esté dentro.
                    </p>

                    <div class="space-y-2 max-h-48 overflow-y-auto">
                        {% for ws in org_workspaces %}
                        <div class="flex items-center gap-3 py-2 px-3 rounded-lg" style="background: var(--neutral-50);">
                            <input type="checkbox" name="ws_{{ ws.id }}" value="1" id="invite-ws-{{ ws.id }}"
                                   class="accent-orange-500 cursor-pointer">
                            <label for="invite-ws-{{ ws.id }}" class="flex-1 text-sm cursor-pointer" style="color: var(--text-primary);">
                                {{ ws.name }}
                            </label>
                        </div>
                        {% endfor %}
                    </div>
                </div>

                <!-- Error container (populated by the global htmx:responseError handler in base.html) -->
                <div id="invite-error" class="mb-3 text-sm text-red-600 empty:hidden"></div>

                <!-- Submit -->
                <div class="flex justify-end gap-3">
                    <button type="button" @click="showInviteModal = false"
                            class="btn-neutral px-5 py-2 text-sm font-medium rounded-full cursor-pointer transition-colors"
                            style="background: var(--neutral-100); color: var(--text-primary);">
                        Cancelar
                    </button>
                    <button type="submit"
                            class="btn-opacity px-5 py-2 text-sm font-medium rounded-full cursor-pointer transition-colors"
                            style="background: var(--primary); color: var(--on-primary);">
                        Enviar invitación
                    </button>
                </div>
            </form>
        </div>
    </div>
</template>
