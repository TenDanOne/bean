<!-- Custom Calendar Event create/edit form (loaded via HTMX into modal) -->
<div class="p-5">
    <h3 class="text-sm font-semibold text-app mb-4">
        {% if event %}Editar evento{% else %}Agregar evento personalizado{% endif %}
    </h3>

    <form {% if event %}
          hx-post="{% url 'calendar:event_edit' workspace_id=workspace.id event_id=event.id %}"
          {% else %}
          hx-post="{% url 'calendar:event_create' workspace_id=workspace.id %}"
          {% endif %}
          hx-swap="none"
          class="space-y-3">
        {% csrf_token %}

        <div>
            <label class="block text-xs font-semibold text-app-body mb-1">Título</label>
            <input type="text" name="title"
                   value="{% if event %}{{ event.title }}{% endif %}"
                   placeholder="Ej.: Lanzamiento de producto, Inicio de campaña"
                   required
                   class="form-input w-full text-sm">
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="block text-xs font-semibold text-app-body mb-1">Fecha de inicio</label>
                <input type="date" name="start_date"
                       value="{% if event %}{{ event.start_date|date:'Y-m-d' }}{% endif %}"
                       required
                       class="form-datetime">
            </div>
            <div>
                <label class="block text-xs font-semibold text-app-body mb-1">Fecha de fin</label>
                <input type="date" name="end_date"
                       value="{% if event %}{{ event.end_date|date:'Y-m-d' }}{% endif %}"
                       required
                       class="form-datetime">
            </div>
        </div>

        <div>
            <label class="block text-xs font-semibold text-app-body mb-1">Color</label>
            <div class="flex items-center gap-2">
                <input type="color" name="color"
                       value="{% if event %}{{ event.color }}{% else %}#3B82F6{% endif %}"
                       class="w-9 h-9 rounded-lg border border-app cursor-pointer p-0.5">
                <div class="flex gap-1.5"
                     x-data="{ presets: ['#3B82F6','#22C55E','#EAB308','#F97316','#EF4444','#8B5CF6','#EC4899','#14B8A6'] }">
                    <template x-for="hex in presets" :key="hex">
                        <button type="button"
                                @click="$el.closest('form').querySelector('[name=color]').value = hex"
                                class="w-6 h-6 rounded-full border-2 border-white shadow-sm hover:scale-110 transition-transform"
                                :style="'background: ' + hex"></button>
                    </template>
                </div>
            </div>
        </div>

        <div>
            <label class="block text-xs font-semibold text-app-body mb-1">Descripción (opcional)</label>
            <textarea name="description" rows="2" placeholder="Notas sobre este evento..." class="form-input w-full text-sm">{% if event %}{{ event.description }}{% endif %}</textarea>
        </div>

        <div class="flex items-center justify-between pt-2">
            {% if event %}
            <form x-data hx-post="{% url 'calendar:event_delete' workspace_id=workspace.id event_id=event.id %}" hx-swap="none" class="inline"
                  @submit="if(!confirm('¿Eliminar este evento?')) $event.preventDefault()">
                {% csrf_token %}
                <button type="submit" class="text-xs text-red-500 hover:text-red-700 font-medium">Eliminar evento</button>
            </form>
            {% else %}
            <div></div>
            {% endif %}
            <div class="flex items-center gap-2">
                <button type="button" @click="showEventForm = false" class="text-sm text-app-tertiary hover:text-app-body py-2 px-3">Cancelar</button>
                <button type="submit" class="btn-brand text-sm py-2 px-4"
                        @htmx:after-request="showEventForm = false">
                    {% if event %}Guardar cambios{% else %}Agregar evento{% endif %}
                </button>
            </div>
        </div>
    </form>
</div>
