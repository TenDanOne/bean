<!-- Invitar cliente Modal -->
<template x-teleport="body">
    <div x-show="showInviteModal" x-transition.opacity
         class="fixed inset-0 z-50 flex items-center justify-center"
         style="background: rgba(0,0,0,0.4);">
        <div @click.outside="showInviteModal = false"
             x-show="showInviteModal"
             x-transition
             class="w-full max-w-md rounded-xl shadow-xl flex flex-col"
             style="background: var(--surface-0);">

            <!-- Header -->
            <div class="flex items-center justify-between px-6 py-4 flex-shrink-0" style="border-bottom: 1px solid var(--border);">
                <h3 class="text-base font-semibold" style="color: var(--text-primary);">Invitar cliente</h3>
                <button @click="showInviteModal = false" class="cursor-pointer" style="color: var(--text-tertiary);">
                    {% icon "xmark" css_class="w-[20px] h-[20px]" %}
                </button>
            </div>

            <!-- Form -->
            <form hx-post="{% url 'client_portal_admin:invite_client' workspace_id=request.workspace.id %}"
                  hx-target="#pending-invites-section"
                  hx-swap="innerHTML"
                  @htmx:after-request.window="if(event.detail.successful) { showInviteModal = false; document.getElementById('no-invites-placeholder')?.remove(); }"
                  class="px-6 py-5">
                {% csrf_token %}

                <!-- Email -->
                <div class="mb-5">
                    <label for="client-email" class="block text-sm font-medium mb-1.5" style="color: var(--text-primary);">Correo electrónico</label>
                    <input type="email" id="client-email" name="email" required placeholder="cliente@ejemplo.com"
                           class="input-focus-surface w-full px-4 py-2.5 text-sm outline-none"
                           style="border: 1px solid var(--border); color: var(--text-primary); background: var(--surface-1);">
                </div>

                <!-- Info -->
                <div class="mb-5 px-3 py-2.5 rounded-lg text-xs" style="background: var(--neutral-50); color: var(--text-secondary);">
                    <p>El cliente recibirá un correo de invitación para crear su cuenta. Al aceptarlo tendrá acceso de <strong>Cliente</strong> a este espacio de trabajo y podrá revisar y aprobar publicaciones desde el portal de clientes.</p>
                </div>

                <!-- Error container -->
                <div id="client-invite-error" class="mb-3"></div>

                <!-- Submit -->
                <div class="flex justify-end gap-3">
                    <button type="button" @click="showInviteModal = false"
                            class="btn-neutral px-5 py-2 text-sm font-medium rounded-full cursor-pointer"
                            style="background: var(--neutral-100); color: var(--text-primary);">
                        Cancelar
                    </button>
                    <button type="submit"
                            class="btn-opacity px-5 py-2 text-sm font-medium rounded-full cursor-pointer"
                            style="background: var(--primary); color: var(--on-primary);">
                        Enviar invitación
                    </button>
                </div>
            </form>
        </div>
    </div>
</template>
