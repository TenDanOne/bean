{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>{% block title %}BrightBean Studio{% endblock %}</title>
    <link rel="icon" href="{% static 'favicon/favicon.ico' %}" sizes="any">
    <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">
    <style>
        .public-shell {
            min-height: 100vh;
            background: var(--surface-page, #faf4ec);
            color: var(--text-primary, #292524);
            font-family: var(--font-body, system-ui, sans-serif);
        }
        .public-wrap { width: min(1100px, calc(100% - 32px)); margin: 0 auto; }
        .public-header {
            display: flex; align-items: center; justify-content: space-between; gap: 24px;
            padding: 24px 0;
        }
        .public-brand { display: inline-flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
        .public-brand img { width: 36px; height: 36px; object-fit: contain; }
        .public-brand strong { font-family: var(--font-display, Georgia, serif); font-size: 1.2rem; }
        .public-nav { display: flex; flex-wrap: wrap; gap: 16px; font-size: .875rem; }
        .public-nav a, .public-link { color: var(--primary, #f97316); font-weight: 650; text-decoration: none; }
        .public-nav a:hover, .public-link:hover { text-decoration: underline; }
        .public-main { padding: 54px 0 76px; }
        .public-hero { max-width: 760px; padding: 36px 0 44px; }
        .public-kicker {
            color: var(--primary, #f97316); font-size: .75rem; font-weight: 800;
            letter-spacing: .12em; text-transform: uppercase;
        }
        .public-title {
            max-width: 760px; margin: 12px 0 20px; color: var(--text-primary, #292524);
            font-family: var(--font-display, Georgia, serif); font-size: clamp(2.35rem, 6vw, 4.7rem);
            line-height: 1.02; letter-spacing: -.04em;
        }
        .public-lede { max-width: 650px; color: var(--text-secondary, #57534e); font-size: 1.08rem; line-height: 1.75; }
        .public-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
        .public-button {
            display: inline-flex; align-items: center; justify-content: center; min-height: 44px;
            padding: 0 18px; border-radius: 999px; border: 1px solid var(--border, #e8d8c4);
            background: var(--surface-0, #fff); color: var(--text-primary, #292524);
            font-weight: 750; text-decoration: none;
        }
        .public-button.primary { border-color: var(--primary, #f97316); background: var(--primary, #f97316); color: var(--on-primary, #fff); }
        .public-button:hover { transform: translateY(-1px); }
        .public-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
        .public-card {
            padding: 24px; border: 1px solid var(--border, #e8d8c4); border-radius: 18px;
            background: var(--surface-0, #fff); box-shadow: var(--relief-flat, 0 1px 2px rgba(124,45,18,.1));
        }
        .public-card h2, .public-card h3 { margin: 0 0 10px; font-family: var(--font-display, Georgia, serif); }
        .public-card p { margin: 0; color: var(--text-secondary, #57534e); line-height: 1.7; }
        .public-section { margin-top: 48px; }
        .public-section h2 { margin: 0 0 14px; font-family: var(--font-display, Georgia, serif); font-size: 2rem; }
        .public-section p, .public-section li { color: var(--text-secondary, #57534e); line-height: 1.75; }
        .public-section ul { padding-left: 1.25rem; }
        .public-prose { max-width: 780px; }
        .public-prose h1 { margin: 0 0 16px; font-family: var(--font-display, Georgia, serif); font-size: clamp(2.2rem, 5vw, 3.6rem); line-height: 1.05; }
        .public-prose h2 { margin: 34px 0 10px; font-family: var(--font-display, Georgia, serif); font-size: 1.55rem; }
        .public-prose p, .public-prose li { color: var(--text-secondary, #57534e); line-height: 1.8; }
        .public-prose ul { padding-left: 1.25rem; }
        .public-footer { border-top: 1px solid var(--border, #e8d8c4); padding: 24px 0 36px; color: var(--text-tertiary, #78716c); font-size: .875rem; }
        .public-footer nav { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 8px; }
        @media (max-width: 720px) {
            .public-header { align-items: flex-start; flex-direction: column; }
            .public-main { padding-top: 24px; }
            .public-grid { grid-template-columns: 1fr; }
            .public-title { font-size: clamp(2.4rem, 13vw, 4rem); }
        }
        @media (prefers-reduced-motion: reduce) {
            .public-button { transition: none; }
            .public-button:hover { transform: none; }
        }
    </style>
</head>
<body class="public-shell">
    <div class="public-wrap">
        <header class="public-header">
            <a class="public-brand" href="{% url 'public_review' %}">
                <img src="{% static 'img/brightbean-studio-logo.webp' %}" alt="BrightBean Studio">
                <strong>BrightBean Studio</strong>
            </a>
            <nav class="public-nav" aria-label="Public navigation">
                <a href="{% url 'public_privacy' %}">Privacy</a>
                <a href="{% url 'public_terms' %}">Terms</a>
                <a href="{% url 'public_support' %}">Support</a>
            </nav>
        </header>

        <main class="public-main">
            {% block content %}{% endblock %}
        </main>

        <footer class="public-footer">
            <div>BrightBean Studio · Internal company social media workspace · Mexico</div>
            <nav aria-label="Legal navigation">
                <a class="public-link" href="{% url 'public_privacy' %}">Privacy Policy</a>
                <a class="public-link" href="{% url 'public_terms' %}">Terms of Service</a>
                <a class="public-link" href="mailto:{{ contact_email }}">{{ contact_email }}</a>
            </nav>
        </footer>
    </div>
</body>
</html>
