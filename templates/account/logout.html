{% extends "base.html" %}
{% load static i18n %}

{% block title %}Sign Out - Brightbean{% endblock %}

{% block auth_content %}
<div class="w-full max-w-md px-4">
    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl mb-4" style="background: var(--neutral-100);">
            {% icon "right-from-bracket" css_class="w-[24px] h-[24px]" %}
        </div>
        <h1 class="text-2xl font-bold tracking-tight" style="color: var(--text-primary);">
            Sign out
        </h1>
        <p class="text-sm mt-1" style="color: var(--text-secondary);">
            Are you sure you want to sign out?
        </p>
    </div>

    <div class="auth-card">
        <form method="post" action="{% url 'account_logout' %}">
            {% csrf_token %}
            <div class="flex gap-3">
                <a href="/" class="btn-outline flex-1">Cancel</a>
                <button type="submit" class="btn-brand flex-1">Sign Out</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
