{% extends "base.html" %}
{% load static i18n %}

{% block title %}Contraseña actualizada · BEAN{% endblock %}

{% block auth_content %}
<div class="w-full max-w-md px-4">
    <!-- Logo & Header -->
    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl mb-4" style="background: var(--success-50);">
            {% icon "circle-check" css_class="w-[24px] h-[24px]" %}
        </div>
        <h1 class="text-2xl font-bold tracking-tight" style="color: var(--text-primary);">
            Contraseña actualizada
        </h1>
        <p class="text-sm mt-1" style="color: var(--text-secondary);">
            Tu contraseña se actualizó correctamente
        </p>
    </div>

    <!-- Card -->
    <div class="auth-card text-center">
        <a href="{% url 'account_login' %}" class="ib-btn ib-btn-primary w-full">
            Iniciar sesión
        </a>
    </div>
</div>
{% endblock %}
