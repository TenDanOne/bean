{% comment %}Modal for creating a new folder. Expects: workspace{% endcomment %}

<div data-modal class="fixed inset-0 z-50 flex items-center justify-center" @keydown.escape.window="showNewFolder = false">
  <!-- Backdrop -->
  <div class="absolute inset-0 bg-black/30 backdrop-blur-sm" @click="showNewFolder = false"></div>

  <!-- Modal -->
  <div class="relative bg-app rounded-2xl shadow-xl w-full max-w-sm mx-4 p-6"
       @click.stop>
    <h3 class="text-base font-semibold mb-4" style="color: var(--text-primary, #1C1917);">Nueva carpeta</h3>

    <form hx-post="{% url 'media_library:folder_create' workspace_id=workspace.id %}"
          hx-target="#folder-tree"
          hx-swap="innerHTML"
          @htmx:after-request="showNewFolder = false">
      <input type="text" name="name" placeholder="Nombre de la carpeta..."
             class="input-focus w-full text-sm px-3 py-2 outline-none mb-4"
             style="border-color: var(--border, #E7E5E4);"
             required autofocus>

      <div class="flex justify-end gap-2">
        <button type="button" @click="showNewFolder = false"
                class="btn-surface-2 px-4 py-2 text-sm font-medium rounded-lg transition-colors cursor-pointer"
                style="color: var(--text-secondary, #57534E);">
         Cancelar
        </button>
        <button type="submit"
                class="btn-primary-hover px-4 py-2 text-sm font-semibold text-app-inverse rounded-lg transition-colors cursor-pointer"
                style="background: var(--primary, #657329);">
         Crear carpeta
        </button>
      </div>
    </form>
  </div>
</div>
