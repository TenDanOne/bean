<!-- Saved reply create/edit form partial -->
<div class="max-w-lg">
    <form method="post">
        {% csrf_token %}
        <div class="space-y-4">
            <div>
                <label for="id_title" class="block text-[13px] font-semibold text-app-body mb-1">Título</label>
                {{ form.title }}
            </div>
            <div>
                <label for="id_body" class="block text-[13px] font-semibold text-app-body mb-1">Texto de la respuesta</label>
                {{ form.body }}
                <p class="text-[11px] text-app-ghost mt-1">Variables: <code>{sender_name}</code>, <code>{account_name}</code>, <code>{post_url}</code></p>
            </div>
        </div>
        <div class="flex items-center gap-3 mt-6">
            <button type="submit"
                    class="inline-flex items-center gap-1.5 px-5 py-2 text-[13px] font-semibold text-app-inverse rounded-full transition-all duration-150 cursor-pointer"
                    style="background: var(--primary); box-shadow: var(--shadow-primary);">
                {% if saved_reply %}Actualizar{% else %}Crear{% endif %} respuesta
            </button>
            <a href="{% url 'inbox:saved_replies' workspace_id=workspace.id %}"
               class="text-[13px] font-medium text-app-tertiary hover:text-app-body transition-colors">Cancelar</a>
        </div>
    </form>
</div>
