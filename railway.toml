# BEAN on Railway: ONE web service built from the Dockerfile (no worker; see HANDOFF).
# Background tasks run from the "Procesar pendientes" button, "publish now" and POST /cron/run.
# Railway ignores the Procfile `release:` line with the dockerfile builder, so migrate runs
# here as a pre-deploy step; it also fires the post_migrate hooks that register recurring jobs.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = "python manage.py migrate"
healthcheckPath = "/health/"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
